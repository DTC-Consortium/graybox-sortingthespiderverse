<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Original stylized illustration of a web-slinger swinging over a maize-and-blue stadium bowl">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a5e" />
      <stop offset="45%" stop-color="#2f4a8f" />
      <stop offset="75%" stop-color="#e08a3c" />
      <stop offset="100%" stop-color="#f6c453" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bowlMaize" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcb05" />
      <stop offset="100%" stop-color="#e0ab00" />
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f7d3a" />
      <stop offset="100%" stop-color="#1f5c28" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)" />
  <circle cx="1180" cy="230" r="170" fill="url(#glow)" />

  <!-- distant skyline hint -->
  <g opacity="0.25" fill="#0d1b3f">
    <rect x="40" y="430" width="26" height="120" />
    <rect x="80" y="400" width="20" height="150" />
    <rect x="115" y="450" width="30" height="100" />
    <rect x="1420" y="410" width="22" height="140" />
    <rect x="1460" y="440" width="28" height="110" />
  </g>

  <!-- Michigan Stadium bowl (stylized, original geometry) -->
  <g>
    <ellipse cx="800" cy="760" rx="760" ry="230" fill="#00274c" />
    <ellipse cx="800" cy="740" rx="720" ry="205" fill="url(#bowlMaize)" />
    <ellipse cx="800" cy="720" rx="660" ry="175" fill="#00274c" />
    <ellipse cx="800" cy="700" rx="600" ry="150" fill="url(#bowlMaize)" opacity="0.9" />
    <ellipse cx="800" cy="690" rx="480" ry="112" fill="#0b3a6b" />
    <ellipse cx="800" cy="700" rx="400" ry="88" fill="url(#field)" />
    <ellipse cx="800" cy="700" rx="400" ry="88" fill="none" stroke="#eafff0" stroke-opacity="0.35" stroke-width="3" />
    <line x1="800" y1="612" x2="800" y2="788" stroke="#eafff0" stroke-opacity="0.35" stroke-width="3" />
  </g>

  <text x="800" y="705" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#ffcb05" opacity="0.85" letter-spacing="6">THE BIG HOUSE</text>

  <!-- web anchor line -->
  <line x1="60" y1="40" x2="905" y2="330" stroke="#e9edf7" stroke-width="3" opacity="0.85" />
  <line x1="905" y1="330" x2="960" y2="300" stroke="#e9edf7" stroke-width="2" opacity="0.6" />
  <line x1="905" y1="330" x2="945" y2="360" stroke="#e9edf7" stroke-width="2" opacity="0.6" />

  <!-- web-slinger silhouette, mid-swing -->
  <g transform="translate(905,330) rotate(28)">
    <!-- motion lines -->
    <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round">
      <line x1="-40" y1="30" x2="-140" y2="10" />
      <line x1="-50" y1="55" x2="-155" y2="45" />
      <line x1="-45" y1="80" x2="-140" y2="85" />
    </g>

    <!-- trailing arm to web line -->
    <line x1="0" y1="0" x2="-8" y2="-58" stroke="#c0273f" stroke-width="10" stroke-linecap="round" />

    <!-- cape-less torso -->
    <ellipse cx="6" cy="42" rx="26" ry="40" fill="#c0273f" />
    <path d="M -18 30 C -6 22, 22 22, 30 34 L 26 60 C 10 68, -4 68, -16 58 Z" fill="#1b3f8f" />

    <!-- head -->
    <circle cx="8" cy="0" r="20" fill="#c0273f" />
    <path d="M -6 -4 Q 8 -14 22 -2" stroke="#0e1420" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- back leg -->
    <path d="M -6 76 C -14 100, -34 112, -54 118" stroke="#1b3f8f" stroke-width="14" fill="none" stroke-linecap="round" />
    <!-- front leg -->
    <path d="M 18 74 C 30 96, 34 118, 26 140" stroke="#c0273f" stroke-width="14" fill="none" stroke-linecap="round" />
    <!-- front arm reaching down -->
    <path d="M 26 40 C 50 46, 66 66, 70 92" stroke="#c0273f" stroke-width="12" fill="none" stroke-linecap="round" />
  </g>

  <!-- subtle web pattern accents in the sky -->
  <g stroke="#e9edf7" stroke-opacity="0.18" stroke-width="2" fill="none">
    <circle cx="60" cy="40" r="60" />
    <circle cx="60" cy="40" r="110" />
    <circle cx="60" cy="40" r="160" />
    <line x1="60" y1="40" x2="220" y2="-60" />
    <line x1="60" y1="40" x2="260" y2="120" />
    <line x1="60" y1="40" x2="60" y2="260" />
  </g>
</svg>
